<section id="Skills" aria-labelledby="skills-title">
  <h2 id="skills-title" class="section-kicker">Skills</h2>

  <div class="skills-grid">
    <div *ngFor="let skill of skills" class="skill">
      <i *ngIf="skill.icon" class="{{skill.icon}}" aria-hidden="true"></i>
      <span *ngIf="skill.kind === 'mongodb'" class="letter-icon" aria-hidden="true">M</span>
      <span *ngIf="skill.kind === 'express'" class="letter-icon express" aria-hidden="true">ex</span>
      <span class="skill-title">{{skill.title}}</span>
    </div>
  </div>

  <div class="supporting-skills" aria-label="Additional skills">
    <span *ngFor="let skill of supportingSkills">{{skill}}</span>
  </div>
</section>
