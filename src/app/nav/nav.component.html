<div class="profile-nav" id="nav">

    <div class="primary-actions" aria-label="Primary links">
      <a class="primary-link" href="#Projects">View projects</a>

  </div>

  <nav class="navs" aria-label="Portfolio sections">
    <ul>
      <li class="list" [ngClass]="{'activated': activeSection === item.name}"
        (click)="activate(item)" *ngFor="let item of items">
        <a [href]="'#' + item.name" class="link">
          <span class="line" aria-hidden="true"></span>
          <span>{{item.name}}</span>
        </a>
      </li>
    </ul>

  <div class="social-links">
    <a href="https://www.linkedin.com/in/mohameddahmed1" target="_blank" rel="noopener noreferrer"
      aria-label="LinkedIn profile">
      <i class="fa-brands fa-linkedin-in" aria-hidden="true"></i>
    </a>
    <button type="button" (click)="copyMail()" aria-label="Copy email address">
      <i class="fa-regular fa-envelope" aria-hidden="true"></i>
    </button>
    <a href="https://github.com/mohamedsalah-2003" target="_blank" rel="noopener noreferrer"

    </a>
    <a class="youtube-link" href="https://www.youtube.com/@MDCodz" target="_blank" rel="noopener noreferrer"

    </a>

</div>

<div id="navs-sm" class="mobile-section-indicator"
  [ngClass]="{'show': activeSection !== 'About', 'hide': activeSection === 'About'}" aria-live="polite">
  <span>{{activeSection}}</span>
</div>

<div [ngClass]="{'visible': notificationVisible}" class="notification-container" role="status" aria-live="polite">
